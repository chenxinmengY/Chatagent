<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聊天 · Chatagent</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/desktop.css"><link rel="stylesheet" href="/chats.css"><link rel="stylesheet" href="/chat-settings.css"></head><body><aside></aside><main class="archive-page chats-page"><header><div><h1>聊天</h1><p>为不同角色建立各自的聊天，独立设置人格与能力。</p></div><div class="chat-buttons"><button id="refresh-chats" class="soft-button">刷新</button><button id="new-chat">＋ 添加聊天</button></div></header><section class="archive-workspace"><p id="chats-feedback" role="status"></p><div class="chat-workspace"><section class="chat-list-card"><label>查找聊天<input id="chat-search" placeholder="名称、人格或 ID"></label><p id="chat-count"></p><nav id="chat-list" aria-label="聊天列表"></nav></section><section class="chat-detail-card"><div class="chat-detail-heading"><div><span class="private-pill">私人聊天 · 聊天模式</span><h2 id="chat-name">选择聊天</h2><p>仅管理此聊天；各自保留设置、上下文和历史。</p></div><div class="chat-buttons"><button id="configure-chat" class="soft-button">设置此聊天</button><a id="enter-chat" class="primary-link">进入聊天</a></div></div><nav class="chat-detail-tabs" aria-label="聊天详情"><button data-detail="overview" class="selected">概况</button><button data-detail="files">记录与文件</button></nav><dl id="chat-facts"></dl><div id="chat-files" hidden></div><p class="chat-detail-note">模型在 DSH 对应会话里选择；插件工具在“设置此聊天 → 能力与权限”中授权。</p></section></div></section><dialog id="create-chat"><form id="create-chat-form"><h2>添加聊天</h2><label>聊天名称<input id="new-chat-name" maxlength="80" required placeholder="给这段聊天起个名字"></label><label>选择人格<select id="new-chat-persona" required></select></label><p>新聊天从空白历史开始，工具权限和主动聊天默认关闭。人格卡可先在设置中创建。</p><p id="create-error" role="status"></p><div class="chat-buttons"><button type="button" id="cancel-create" class="soft-button">取消</button><button id="confirm-create" type="submit">创建聊天</button></div></form></dialog></main><script type="module" src="/shell.js"></script><script type="module" src="/chats.js"></script></body></html>
