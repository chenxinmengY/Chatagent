<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/desktop.css"><link rel="stylesheet" href="/manage.css"></head><body><aside></aside><main class="archive-page"><header><h1>设置</h1></header><section class="archive-workspace"><p id="feedback" role="status"></p><p id="error" role="alert"></p>
<section class="management-card" data-settings-section="appearance"><h2>外观</h2><p>外观保存在当前设备。调整后先看预览，保存后应用。</p><div id="appearance-fields"></div><div id="appearance-preview"><p class="bubble">今天也想听你说说发生了什么。</p><p class="bubble user-preview">好呀，我们慢慢聊。</p></div><div class="appearance-actions"><button id="appearance-save">保存外观</button><button id="appearance-reset">恢复默认预览</button></div></section>
<section class="management-card" data-settings-section="data"><h2>导入与备份</h2><h3>备份当前空间</h3><p><span id="backup-help">完整备份包含聊天、附件、配置和原生记忆，保存在这台电脑。</span>导出的聊天资料包用于迁移，不包含附件原文件。</p><div class="management-actions"><button id="workspace-backup">创建完整备份</button><a id="export" class="text-link" href="#">导出聊天资料包（JSON）</a></div><h3>导入其他聊天资料</h3><p>先选择文件并检查内容，再确认导入。旧聊天会加入对话历史；记忆、人格和日记先保存为档案，原生记忆由当前连接的记忆插件管理。</p><div class="migration-grid"><label class="management-field">文件来自哪里<select id="import-format"><option value="portable">Chatagent 资料包 / 转换后的 JSON</option><option value="astrbot">AstrBot 控制台导出（JSONL）</option></select></label><label id="import-source-field" class="management-field" hidden>给这个 AstrBot 来源起个名字<input id="import-source" value="astrbot" maxlength="100" placeholder="例如：家里的 AstrBot"><small>用于区分不同来源，不是账号或密码。</small></label><label class="management-field">选择导出的文件<input id="import-file" type="file" accept=".json,.jsonl" aria-label="选择资料包"></label><label id="import-conversation-field" class="management-field" hidden>选择要导入的对话<select id="import-conversation" aria-label="选择来源对话"></select></label></div><p id="import-format-help">可选择 Chatagent 导出的资料包；WeChatAgent 等来源须先转换为支持的 JSON 格式。</p><div class="management-actions"><button id="import-preview">检查导入内容</button><button id="import-apply" disabled>确认导入</button></div><pre id="import-report" role="status"></pre><details><summary>查看已导入的记忆、人格与日记档案</summary><div id="imported-records"></div></details></section>
<section class="management-card" data-settings-section="workspace"><h2>工作区与资料位置</h2><pre id="workspace"></pre></section></section></main><script type="module" src="/customize.js"></script><script type="module" src="/shell.js"></script></body></html>
