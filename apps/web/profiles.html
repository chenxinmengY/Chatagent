<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人资料 · Chatagent</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/desktop.css"><link rel="stylesheet" href="/profiles.css"></head><body><aside></aside><main class="profile-page"><header><div><p class="breadcrumb">属于你们的私人空间</p><h1>个人资料</h1><p>换一张头像，写一点关于自己。</p></div><a class="text-link" href="/">返回聊天 →</a></header><div class="profile-layout"><nav class="profile-tabs" aria-label="资料对象"><button type="button" data-person="self">我的资料<span>你的头像与个人信息</span></button><button type="button" data-person="agent">小鲸鱼资料<span>在电脑上设置 Agent 资料</span></button></nav><form id="profile-form" class="profile-card"><div class="profile-card-heading"><div><p class="eyebrow" id="profile-kind">我的资料</p><h2 id="profile-name">我</h2></div><span class="profile-badge">仅在私人空间展示</span></div><div class="avatar-section"><button type="button" id="avatar-select" aria-label="选择头像"><img id="avatar-preview" src="/whale.svg" alt="头像预览"><span>更换头像</span></button><div><h3>方形头像</h3><p>支持 JPG、PNG、WebP，图片最大 10 MB。<br>以中心裁切为正方形，可调整缩放。</p><button type="button" class="soft-button" id="avatar-reset">恢复默认头像</button></div></div><input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp" hidden><label id="crop-controls" hidden>头像缩放<input id="avatar-zoom" type="range" min="1" max="3" step="0.05" value="1"></label><div class="profile-fields"><label for="nickname">昵称<input id="nickname" maxlength="40" required autocomplete="off" placeholder="怎么称呼你"></label><label for="signature">个性签名<input id="signature" maxlength="160" autocomplete="off" placeholder="写一句此刻想说的话"></label><fieldset class="region-fields"><legend>所在地区</legend><div><select id="region-country" aria-label="国家或地区"></select><select id="region-province" aria-label="省、州或地区"></select></div></fieldset></div><div class="profile-actions"><span id="profile-status" role="status">正在读取…</span><button type="button" class="soft-button" id="profile-cancel">放弃修改</button><button type="submit" id="profile-save" disabled>保存资料</button></div></form></div></main><script type="module" src="/profiles.js"></script><script type="module" src="/shell.js"></script></body></html>
