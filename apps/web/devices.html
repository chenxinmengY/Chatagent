<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备管理 · 小鲸鱼</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/desktop.css"></head>
<body><aside></aside><main class="device-page"><header><div><h1>设备管理</h1><p>只有你配对的设备，才能进入这个私人空间。</p></div><a href="/">返回聊天</a></header>
<div class="notice" id="gateway-note">远程连接尚未启用。当前配对入口仅供本机验证，手机暂时无法连接。</div>
<section class="device-card"><h2>添加设备</h2><p>配对凭据有效期为5分钟，仅用于登记一台设备。重新生成或取消后，旧邀请立即失效。</p><button id="invite" disabled>生成配对凭据</button>
<div id="invitation" hidden><label for="credential">一次性配对凭据</label><textarea id="credential" readonly rows="3" spellcheck="false"></textarea><p id="expires"></p><button id="cancel-invite">取消本次邀请</button></div>
<p id="device-status" role="status">正在连接本地空间…</p></section>
<section class="device-card"><div class="device-heading"><h2>已配对设备</h2><button id="refresh-devices">刷新列表</button></div><p>撤销后，设备不能再访问聊天或附件。已保存在电脑上的消息会保留。</p><div id="device-list"></div></section>
<p class="muted">恢复聊天备份后，需要重新配对设备。</p>
</main><script type="module" src="/devices.js"></script><script type="module" src="/shell.js"></script></body></html>
